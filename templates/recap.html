<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Recap presenze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Recap presenze</h1>
            <a href="/" class="btn btn-secondary">Torna all'elenco</a>
        </div>

        <table class="table table-bordered">
            <tr><th>Nome</th><th>Cognome</th><th>Presenze</th><th>Assenze</th></tr>
            {% for id in riepilogo %}
            <tr>
                <td>{{ riepilogo[id]["nome"] }}</td>
                <td>{{ riepilogo[id]["cognome"] }}</td>
                <td>{{ riepilogo[id]["presenti"] }}</td>
                <td>{{ riepilogo[id]["assenti"] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>

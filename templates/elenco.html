<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Elenco studenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Elenco studenti</h1>
            <div>
                <a href="/registra" class="btn btn-success">Nuovo studente</a>
                <a href="/recap" class="btn btn-info">Vai al recap</a>
                <a href="/logout" class="btn btn-outline-secondary">Esci</a>
            </div>
        </div>

        <table class="table table-bordered">
            <tr><th>Nome</th><th>Cognome</th><th>Presenza di oggi</th></tr>
            {% for studente in studenti %}
            <tr>
                <td>{{ studente[1] }}</td>
                <td>{{ studente[2] }}</td>
                <td>
                    <form method="POST" action="/presenza/{{ studente[0] }}" class="d-flex gap-2">
                        <select name="stato" class="form-select form-select-sm" style="width:auto;">
                            <option value="presente">Presente</option>
                            <option value="assente">Assente</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Salva</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registra studente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4" style="max-width: 500px;">
        <h1>Registra un nuovo studente</h1>

        <form method="POST" action="/registra">
            <div class="mb-3">
                <label>Nome</label>
                <input type="text" name="nome" class="form-control">
            </div>
            <div class="mb-3">
                <label>Cognome</label>
                <input type="text" name="cognome" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Salva studente</button>
            <a href="/" class="btn btn-secondary">Torna all'elenco</a>
        </form>
    </div>

</body>
</html>
